name: two-worlds-ci

on:
  push:
    paths:
      - "two_worlds.py"
      - "commitment_dissolve.py"
      - "test_two_worlds.py"
      - ".github/workflows/two-worlds-ci.yml"
  pull_request:
    paths:
      - "two_worlds.py"
      - "commitment_dissolve.py"
      - "test_two_worlds.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pillow matplotlib
      - run: python -m unittest test_two_worlds -v
